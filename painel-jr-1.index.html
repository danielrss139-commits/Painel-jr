:root{--bg:#0a0806;--bg1:#120d08;--fg:#f1e9d8;--mut:#9a8f7d;--line:#221a10;--line2:#33281a;--soft:#18120a;--card:#100c07;--gs:rgba(20,15,9,.9);--sd:rgba(0,0,0,.6);
--g1:#f8e3a8;--g2:#f3cd6f;--g3:#e2ab3f;--g4:#a97a28;--g5:#8a5f22;--gold:linear-gradient(135deg,#f8e3a8 0%,#f3cd6f 22%,#e2ab3f 52%,#c8912f 78%,#a97a28 100%);
--ac:#ebc062;--acs:rgba(226,171,63,.12);--glow:rgba(226,171,63,.10);--rd:#e2806f;--rds:rgba(226,128,111,.11);--gd:#e2ab3f;
--spr:cubic-bezier(.22,1.18,.36,1);--ez:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:radial-gradient(120% 55% at 50% -12%,#24180a 0%,var(--bg1) 42%,var(--bg) 100%) fixed var(--bg)}
body{margin:0;background:transparent;color:var(--fg);font:400 15px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:17px}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:1.5px solid var(--g3);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fundo vivo: degradê escuro em movimento lento + textura fina */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
background:radial-gradient(40% 35% at 25% 60%,rgba(226,171,63,.07),transparent 70%),radial-gradient(35% 30% at 75% 40%,rgba(169,122,40,.08),transparent 70%),radial-gradient(30% 30% at 55% 85%,rgba(248,227,168,.03),transparent 70%);
filter:blur(30px);animation:bgDrift 28s ease-in-out infinite alternate;will-change:transform;
-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.035;

  if (!firebaseOk) { var ls = $('#lock-sub'); ls.textContent = 'Não foi possível carregar o banco de dados. Verifique a internet e recarregue a página.'; ls.classList.add('on'); }
})();


/* ---------- instalar app (Android: prompt do navegador; iPhone: passo a passo do Safari) ---------- */
var instEvt = null;
function standalone() { try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; } catch (e) { return false; } }
function isIOS() { var u = navigator.userAgent || ''; return /iPhone|iPad|iPod/i.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function iosOutroNavegador() { return /CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Instagram|FBAN|FBAV|Line\/|WhatsApp/i.test(navigator.userAgent || ''); }
function instDismissed() { try { return localStorage.getItem('jr_inst_ok') === '1'; } catch (e) { return false; } }
function instDismiss() { try { localStorage.setItem('jr_inst_ok', '1'); } catch (e) {} }
function podeInstalar() { return !standalone() && (!!instEvt || isIOS()); }
function instBanner() {
  if (!podeInstalar() || instDismissed()) return '';
  return '<div class="inst" role="region" aria-label="Instalar app"><div class="t"><b>Instale o painel</b><span>Abra direto da tela de início, como um app.</span></div>' +
    '<button type="button" class="ib" data-act="install">Instalar</button><button type="button" class="ix" data-act="instx" aria-label="Dispensar aviso">' + ICON.x + '</button></div>';
}
function instAjustes() {
  if (standalone()) return '<h2>App</h2><div class="card"><div class="kv"><span class="l">App na tela de início</span><b style="color:var(--g2)">Instalado</b></div></div>';
  return '<h2>App</h2><button type="button" class="btn" data-act="install">' + ICON.dl + 'Instalar app</button>';
}
function instalar() {
  if (instEvt) {
    var ev = instEvt; instEvt = null;
    ev.prompt();
    (ev.userChoice || Promise.resolve({})).then(function (c) { if (c && c.outcome === 'accepted') { instDismiss(); toast('App instalado'); } render(); }).catch(function () {});
    return;
  }
  if (isIOS()) { iosSheet(); return; }
  sheet('<h3>Instalar app</h3><p>No Chrome ou Edge, abra o menu do navegador (⋮) e toque em <q>Instalar app</q> ou <q>Adicionar à tela inicial</q>.</p><button type="button" class="btn" data-ok>Entendi</button>', 'Instalar app').querySelector('[data-ok]').addEventListener('click', function () { closeSheet(); });
}
function iosSheet() {
  var h = '<h3>Instalar no iPhone</h3><p>O painel fica na tela de início e abre em tela cheia, como um app.</p>';
  if (iosOutroNavegador()) h += '<div class="inote">' + ICON.info + '<span>Abra este link no <b>Safari</b> para instalar. Em outros apps o iPhone não mostra essa opção.</span></div>';
  h += '<ol class="steps">' +
    '<li style="--i:0"><span class="si">' + ICON.share + '</span><span class="tx">Toque em <q>Compartilhar</q><small>O botão fica na barra do Safari, embaixo da tela.</small></span></li>' +
    '<li style="--i:1"><span class="si">' + ICON.addsq + '</span><span class="tx">Toque em <q>Adicionar à Tela de Início</q><small>Role a lista para baixo se não aparecer.</small></span></li>' +
    '<li style="--i:2"><span class="si">' + ICON.chk + '</span><span class="tx">Toque em <q>Adicionar</q><small>Pronto: o ícone dourado da JR aparece na tela.</small></span></li></ol>' +
    '<div class="iarw" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="19"/><polyline points="6.5 13.5 12 19 17.5 13.5"/></svg></div>' +
    '<button type="button" class="btn" data-ok>Entendi</button>';
  var ov = sheet(h, 'Instalar no iPhone');
  ov.querySelector('[data-ok]').addEventListener('click', function () { instDismiss(); closeSheet(); render(); });
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); instEvt = e; if (!document.body.classList.contains('locked')) render(); });
window.addEventListener('appinstalled', function () { instEvt = null; instDismiss(); if (!document.body.classList.contains('locked')) { render(); toast('App instalado'); } });

</script>
